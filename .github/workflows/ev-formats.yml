name: Video formats (samples)
# the 12-hour video in each frame format, to compare them (tools/ecmwf_video.py with EV_FORMAT); the files are the run's artifacts
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy: {fail-fast: false, matrix: {fmt: ['9x16', '4x5']}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          (sudo apt-get update -qq >/dev/null || true); sudo apt-get install -y -qq --no-install-recommends --fix-missing ffmpeg fonts-inter >/dev/null; rm -rf ~/.cache/matplotlib
          pip install -q requests numpy scipy matplotlib pillow eccodes metpy opencv-python-headless qrcode
          EV_FORMAT=${{ matrix.fmt }} EV_KINDS=12h,7d EV_REGIONS=none python -W ignore tools/ecmwf_video.py out ru
          mv out/12h_ru.mp4 "out/osmon_${{ matrix.fmt }}.mp4"; mv out/7d_ru.mp4 "out/osmon7_${{ matrix.fmt }}.mp4"
          mkdir pub && mv out/osmon*_${{ matrix.fmt }}.mp4 pub/ && cd pub && git init -q && git checkout -q -b "fmt-${{ matrix.fmt }}" && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "format ${{ matrix.fmt }}"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "fmt-${{ matrix.fmt }}"
