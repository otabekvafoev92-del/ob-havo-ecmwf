name: Probe
# prints what an ECMWF open-data index holds (to check a stream)
on:
  workflow_dispatch:
    inputs:
      url: {description: 'index url', required: true}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "${{ inputs.url }}" -o i.txt; wc -l i.txt; head -c 300 i.txt; echo
          python3 -c "import json,collections;L=[json.loads(l) for l in open('i.txt')];print(collections.Counter(l.get('type') for l in L));print(sorted({(l.get('levtype'),l.get('levelist',''),l['param']) for l in L if l.get('type')=='cf'}))"
