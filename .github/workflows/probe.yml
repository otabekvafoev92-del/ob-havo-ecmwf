name: Probe
# prints a few lines of an ECMWF open-data index (to check what a stream holds)
on:
  workflow_dispatch:
    inputs:
      url: {description: 'index url', required: true}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s "${{ inputs.url }}" | head -c 600; echo; curl -s "${{ inputs.url }}" | grep -c '"cf"' ; curl -s "${{ inputs.url }}" | grep '"cf"' | grep -E '"(msl|tcwv|tp|tcc|2t|10u|10fg)"|"700"' | head -20
