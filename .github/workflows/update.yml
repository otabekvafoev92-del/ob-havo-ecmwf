name: Update ECMWF forecast

# Parallel jobs (about 2 h instead of 3–4 h in one job):
#   charts ─────────────────────────────┐
#   fetch ── render × 4 (cis-a, cis-b,  ├── assemble ── deploy
#            cities, world) ────────────┘
on:
  schedule:
    # 09:20 and 21:20 UTC = 14:20 and 02:20 in Tashkent (00/12 UTC runs are ready by then)
    - cron: '20 9,21 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['site/**', 'pipeline/**', 'prob/**', '.github/workflows/update.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Fetch and decode ECMWF charts
        run: node pipeline/build.mjs site/data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real wind (ECMWF open data, 4 heights)
        run: |
          pip install eccodes numpy requests pillow
          python pipeline/wind.py site/data "$(node -p "require('./site/data/forecast.json').run")"
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: site/data
          retention-days: 1

  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Multimodel precipitation, temperature, clouds and wind (ECMWF, NOAA, DWD)
        run: |
          pip install eccodes numpy requests
          python prob/fetch.py prob.npz
      - uses: actions/upload-artifact@v4
        with:
          name: npz
          path: '*.npz'
          retention-days: 1

  render:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:  # 14 runners side by side: one language per job, one city set per job
        include:
          - { part: cis-a-uz, npz: prob.npz, args: '--regions cis,UZ,KZ,KG,TJ,TM --langs uz' }
          - { part: cis-a-ru, npz: prob.npz, args: '--regions cis,UZ,KZ,KG,TJ,TM --langs ru' }
          - { part: cis-a-tr, npz: prob.npz, args: '--regions cis,UZ,KZ,KG,TJ,TM --langs tr' }
          - { part: cis-b-uz, npz: prob.npz, args: '--regions AZ,AM,BY,MD,RU,TR --langs uz' }
          - { part: cis-b-ru, npz: prob.npz, args: '--regions AZ,AM,BY,MD,RU,TR --langs ru' }
          - { part: cis-b-tr, npz: prob.npz, args: '--regions AZ,AM,BY,MD,RU,TR --langs tr' }
          - { part: cities-UZ-ru, npz: prob.npz, args: "--regions UZ --langs ru --products '' --city-videos UZ --city-langs ru" }
          - { part: cities-UZ-uz, npz: prob.npz, args: "--regions UZ --langs uz --products '' --city-videos UZ --city-langs uz" }
          - { part: cities-KZ-ru, npz: prob.npz, args: "--regions KZ --langs ru --products '' --city-videos KZ --city-langs ru" }
          - { part: cities-KZ-uz, npz: prob.npz, args: "--regions KZ --langs uz --products '' --city-videos KZ --city-langs uz" }
          - { part: world-uz, npz: glob.npz, args: '--geo prob/geo_world.json --regions world,EU,AS,AF,NA,SA,OC --products prob,temp --dpi 150 --width 1080 --crf 27 --langs uz' }
          - { part: world-ru, npz: glob.npz, args: '--geo prob/geo_world.json --regions world,EU,AS,AF,NA,SA,OC --products prob,temp --dpi 150 --width 1080 --crf 27 --langs ru' }
          - { part: world-tr, npz: glob.npz, args: '--geo prob/geo_world.json --regions world,EU,AS,AF,NA,SA,OC --products prob,temp --dpi 150 --width 1080 --crf 27 --langs tr' }
          - { part: globe, args: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: npz
      - name: Render ${{ matrix.part }}
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install numpy scipy matplotlib pyproj pillow
          if [ "${{ matrix.part }}" = globe ]; then
            python prob/export_5d.py glob.npz wx.npz out/d5
            python prob/points.py glob.npz wx.npz out
          else
            python prob/render.py ${{ matrix.npz }} out ${{ matrix.args }} --wx wx.npz
          fi
          rm -rf out/frames
      - uses: actions/upload-artifact@v4
        with:
          name: prob-${{ matrix.part }}
          path: out
          retention-days: 1

  assemble:
    needs: [charts, render]
    if: always() && needs.charts.result == 'success' && needs.render.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: site/data
      - uses: actions/download-artifact@v4
        with:
          pattern: prob-*
          path: parts
      - name: Join the render parts (the city videos last)
        run: |
          ls parts
          python prob/merge.py site/prob parts/prob-globe parts/prob-world-* parts/prob-cis-* parts/prob-cities-*
          test -f site/prob/manifest.json
          du -sh site site/prob site/prob/pt
      - name: Send Telegram summary
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_LANG: ${{ vars.TG_LANG }}
          TG_CITIES: ${{ vars.TG_CITIES }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node pipeline/telegram.mjs site/data
      - name: Send precipitation-probability videos to Telegram
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROB_TG: ${{ vars.PROB_TG }}
        run: |
          pip install requests
          python prob/telegram_send.py site/prob
      - name: Point the site at the bot worker (visit counter, Telegram)
        if: vars.BOT_URL != ''
        run: sed -i 's|<meta name="osmon-api" content="">|<meta name="osmon-api" content="${{ vars.BOT_URL }}">|' site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
