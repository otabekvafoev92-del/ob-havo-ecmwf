name: Update ECMWF forecast

# Parallel jobs (about 40 min instead of 3–4 h in one job):
#   charts ─────────────────────────────┐
#   fetch ── render × 4 (cis-a, cis-b,  ├── assemble ── deploy
#            cities, world) ────────────┘
on:
  schedule:
    # GitHub often runs scheduled builds late or skips them when it is busy, so we knock every hour: the gate job
    # below lets a build through only when the live site was built over 2 h 10 min ago (so about every 3 hours) or the code changed
    - cron: '17 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['site/**', 'pipeline/**', 'prob/**', '.github/workflows/update.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        run: |
          # the live site says which code built it and when (written by the assemble job below)
          go=true
          if [ "${{ github.event_name }}" = schedule ] && curl -sfo b.json https://otabekvafoev92-del.github.io/ob-havo-ecmwf/build.json; then
            cat b.json; echo
            sha=$(python3 -c "import json;print(json.load(open('b.json')).get('sha',''))")
            t=$(python3 -c "import json;print(json.load(open('b.json')).get('built',''))")
            if [ "$sha" = "${{ github.sha }}" ] && [ -n "$t" ] && [ $(( $(date +%s) - $(date -d "$t" +%s) )) -lt 7800 ]; then go=false; fi
          fi
          echo "go=$go" | tee -a "$GITHUB_OUTPUT"

  charts:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Fetch and decode ECMWF charts
        run: node pipeline/build.mjs site/data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real wind (ECMWF open data, 4 heights)
        run: |
          pip install eccodes numpy requests pillow
          python pipeline/wind.py site/data "$(node -p "require('./site/data/forecast.json').run")"
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: site/data
          retention-days: 1

  fetch:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Multimodel precipitation, temperature, clouds and wind (ECMWF, NOAA, DWD)
        run: |
          pip install eccodes numpy requests scipy
          python prob/fetch.py prob.npz
      - uses: actions/upload-artifact@v4
        with:
          name: npz
          path: '*.npz'
          retention-days: 1

  render:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:  # 14 runners side by side: one language per job, one city set per job
        include:
          - { part: cis-a-uz, npz: prob.npz, args: '--regions cis,UZ,KZ,KG,TJ,TM --langs uz' }
          - { part: cis-a-ru, npz: prob.npz, args: '--regions cis,UZ,KZ,KG,TJ,TM --langs ru' }
          - { part: cis-a-tr, npz: prob.npz, args: "--regions cis,UZ,KZ,KG,TJ,TM,AM,BY,MD,RU --langs tr --products ''" }  # Turkish: texts only, videos from Russian
          - { part: cis-b-uz, npz: prob.npz, args: '--regions AZ,AM,BY,MD,RU,TR --langs uz' }
          - { part: cis-b-ru, npz: prob.npz, args: '--regions AZ,AM,BY,MD,RU,TR --langs ru' }
          - { part: cis-b-tr, npz: prob.npz, args: '--regions AZ,TR --langs tr' }
          - { part: cities-UZ-ru, npz: prob.npz, args: "--regions UZ --langs ru --products '' --city-videos UZ --city-langs ru" }
          - { part: cities-UZ-uz, npz: prob.npz, args: "--regions UZ --langs uz --products '' --city-videos UZ --city-langs uz" }
          - { part: cities-KZ-ru, npz: prob.npz, args: "--regions KZ --langs ru --products '' --city-videos KZ --city-langs ru" }
          - { part: cities-KZ-uz, npz: prob.npz, args: "--regions KZ --langs uz --products '' --city-videos KZ --city-langs uz" }
          - { part: world-uz, npz: glob.npz, args: '--geo prob/geo_world.json --regions world,EU,AS,AF,NA,SA,OC --products prob,temp --dpi 150 --width 1920 --crf 22 --langs uz' }
          - { part: world-ru, npz: glob.npz, args: '--geo prob/geo_world.json --regions world,EU,AS,AF,NA,SA,OC --products prob,temp --dpi 150 --width 1920 --crf 22 --langs ru' }
          - { part: world-tr, npz: glob.npz, args: '--geo prob/geo_world.json --regions world,EU,AS,AF,NA,SA,OC --products prob,temp --dpi 150 --width 1920 --crf 22 --langs tr' }
          - { part: globe, args: '' }
          - { part: yt, args: '' }
          - { part: outlook, args: '' }
          - { part: hr-a, args: '--regions UZ,KZ,KG,TJ,TM,AZ' }
          - { part: hr-b, args: '--regions AM,BY,MD,RU,TR --langs uz,ru,tr' }
          - { part: hr-moist, args: '' }  # the moisture coming in: a broadcast-style video (Uzbekistan, Kazakhstan)
          - { part: hr-moist2-uz, args: 'UZ' }  # 2 days, a version with a window on every region (the bot's ⏱ button)
          - { part: hr-moist2-kz, args: 'KZ' }
          - { part: hr-moist2-kg, args: 'KG' }
          - { part: hr-moist15-uz, args: 'UZ' }  # the same over 15 days, one country a job (they are long)
          - { part: hr-moist15-kz, args: 'KZ' }
          - { part: hr-moist15-kg, args: 'KG' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: npz
      - name: Restore the forecast-accuracy history
        if: matrix.part == 'globe'
        uses: actions/cache/restore@v4
        with:
          path: vh
          key: verify-${{ github.run_id }}
          restore-keys: verify-
      - name: Render ${{ matrix.part }}
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install numpy scipy matplotlib pyproj pillow requests
          if [ "${{ matrix.part }}" = outlook ]; then
            # weekly and monthly outlooks change once a day: draw them when the live ones are 11 h old (twice a day, the free
            # Open-Meteo quota) or the code changed; otherwise reuse the live ones
            SITE=https://otabekvafoev92-del.github.io/ob-havo-ecmwf/prob
            OLD=1; if curl -sfo /tmp/ol.json $SITE/outlook/index.json && grep -q '"imgs"' /tmp/ol.json; then
              OLD=$(python3 -c "import json,datetime as d;m=json.load(open('/tmp/ol.json')).get('made','');t=d.datetime.strptime(m[:16],'%Y-%m-%dT%H:%M').replace(tzinfo=d.timezone.utc) if m else None;print(1 if not t or (d.datetime.now(d.timezone.utc)-t).total_seconds()>11*3600 else 0)" || echo 1); fi
            if [ "${{ github.event_name }}" != schedule ] && [ "${{ github.event_name }}" != workflow_dispatch ] || [ "$OLD" = 1 ]; then
              python prob/outlook.py prob.npz wx.npz out
            else
              mkdir -p out/outlook && cp /tmp/ol.json out/outlook/index.json
              for f in $(python -c "import json;print(' '.join(f for i in json.load(open('/tmp/ol.json'))['items'] for f in i.get('imgs', [i['img']])))"); do curl -sfo out/$f $SITE/$f || true; done
              curl -sfo out/outlook/alerts.json $SITE/outlook/alerts.json && cp out/outlook/alerts.json out/alerts.json || true
              echo reused the live outlook
            fi
            python prob/mountains.py out || echo 'mountains failed'  # snow and trip days in the mountains, every run
          elif [[ "${{ matrix.part }}" == hr-moist2-* ]]; then
            pip install eccodes metpy >/dev/null && timeout 45m python prob/moisture.py prob.npz out --regions ${{ matrix.args }} --langs ru,uz --days 2 || echo 'moisture 2-day video failed'
          elif [[ "${{ matrix.part }}" == hr-moist15-* ]]; then
            pip install eccodes metpy >/dev/null && timeout 35m python prob/moisture.py prob.npz out --regions ${{ matrix.args }} --langs ru,uz --days 15 || echo 'moisture 15-day video failed'  # never holds the build up
          elif [ "${{ matrix.part }}" = hr-moist ]; then
            pip install eccodes metpy >/dev/null && timeout 35m python prob/moisture.py prob.npz out --regions UZ,KZ,KG --langs ru,uz || echo 'moisture video failed'
          elif [ "${{ matrix.part }}" = hr-a ] || [ "${{ matrix.part }}" = hr-b ]; then
            python prob/hourly.py prob.npz wx.npz out ${{ matrix.args }}
            if [ "${{ matrix.part }}" = hr-a ]; then  # where the rain and snow come from (Uzbekistan, Kazakhstan)
              pip install eccodes >/dev/null && python prob/trajectory.py prob.npz out --regions UZ,KZ,KG --langs ru,uz || echo 'trajectories failed'
            fi
          elif [ "${{ matrix.part }}" = yt ]; then
            python prob/broadcast.py prob.npz glob.npz wx.npz out --langs ru,uz
          elif [ "${{ matrix.part }}" = globe ]; then
            python prob/export_5d.py glob.npz wx.npz out/d5
            python prob/points.py glob.npz wx.npz out prob.npz
            # forecast accuracy: the history is kept in the build cache and on the site (both are read, so one lost copy loses nothing)
            curl -sfo /tmp/vh.json https://otabekvafoev92-del.github.io/ob-havo-ecmwf/prob/verify/history.json || echo 'no live history'
            python prob/verify.py prob.npz wx.npz out vh/history.json /tmp/vh.json || echo 'verify failed'
            mkdir -p vh && cp out/verify/history.json vh/history.json || true
          else
            python prob/render.py ${{ matrix.npz }} out ${{ matrix.args }} --wx wx.npz
          fi
          rm -rf out/frames
      - name: Save the forecast-accuracy history
        if: matrix.part == 'globe'
        uses: actions/cache/save@v4
        with:
          path: vh
          key: verify-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: prob-${{ matrix.part }}
          path: out
          retention-days: 1

  assemble:
    needs: [charts, render]
    if: always() && needs.charts.result == 'success' && needs.render.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: site/data
      - uses: actions/download-artifact@v4
        with:
          pattern: prob-*
          path: parts
      - name: Join the render parts (the city videos last)
        run: |
          ls parts
          python prob/merge.py site/prob parts/prob-globe parts/prob-yt parts/prob-outlook parts/prob-hr-* parts/prob-world-* parts/prob-cis-* parts/prob-cities-*
          test -f site/prob/manifest.json
          python prob/citypages.py site https://otabekvafoev92-del.github.io/ob-havo-ecmwf || echo 'city pages failed'
          du -sh site site/prob site/prob/pt
      - name: Send Telegram summary
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_LANG: ${{ vars.TG_LANG }}
          TG_CITIES: ${{ vars.TG_CITIES }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node pipeline/telegram.mjs site/data
      - name: Send precipitation-probability videos to Telegram
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROB_TG: ${{ vars.PROB_TG }}
        run: |
          pip install requests
          python prob/telegram_send.py site/prob
      - name: Note which code built the site and when (the gate job reads it)
        run: python3 -c "import json,datetime,os;m=json.load(open('site/prob/alerts.json')).get('run','') if os.path.exists('site/prob/alerts.json') else '';json.dump({'sha':'${{ github.sha }}','built':datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),'run':'${{ github.run_id }}','model':m},open('site/build.json','w'))"
      - name: Point the site at the bot worker (visit counter, Telegram)
        if: vars.BOT_URL != ''
        run: sed -i 's|<meta name="osmon-api" content="">|<meta name="osmon-api" content="${{ vars.BOT_URL }}">|' site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
