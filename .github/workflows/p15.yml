name: Chance of precipitation and temperature, 15 days (video)
# the first Osmon video's look, made nicer (tools/prob15_video.py), from the multimodel data of the last site run; kept on the "p15" branch
on:
  workflow_run: {workflows: ['Update ECMWF forecast'], types: [completed]}
  workflow_dispatch: {}
permissions: {contents: write, actions: read}
concurrency: {group: p15, cancel-in-progress: true}
jobs:
  v:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          (sudo apt-get update -qq >/dev/null || true); sudo apt-get install -y -qq --no-install-recommends --fix-missing ffmpeg fonts-inter >/dev/null; rm -rf ~/.cache/matplotlib
          pip install -q numpy scipy matplotlib pyproj qrcode
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=npz&per_page=1" --jq '.artifacts[0].workflow_run.id')
          gh run download $id -n npz -D npz
          python -W ignore tools/prob15_video.py npz/prob.npz npz/wx.npz p15 ru,uz
          cd p15 && git init -q && git checkout -q -b p15 && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "15 days $(date -u +%F' '%H:%M)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" p15
        env: {GH_TOKEN: '${{ github.token }}'}
