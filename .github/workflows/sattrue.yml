name: Satellite in true colour
# the NASA GIBS passes (VIIRS 375 m, MODIS 250 m) of the last two days over Uzbekistan as a picture and a video (tools/sat_true.py); kept on the "sattrue" branch
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: {group: sattrue, cancel-in-progress: true}
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          (sudo apt-get update -qq >/dev/null || true); sudo apt-get install -y -qq --no-install-recommends --fix-missing ffmpeg fonts-inter >/dev/null; rm -rf ~/.cache/matplotlib
          pip install -q numpy scipy matplotlib pillow requests qrcode pyproj skyfield
          python -u -W ignore tools/sat_true.py st ru,uz
          cd st && git init -q && git checkout -q -b sattrue && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "true colour $(date -u +%F' '%H:%M)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sattrue
