name: Air quality, 24 hours (video)
# CAMS (Copernicus) air quality over Uzbekistan for the next 24 hours, hour by hour (tools/air_video.py); every hour; kept on the "air" branch
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: {group: air, cancel-in-progress: true}
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          (sudo apt-get update -qq >/dev/null || true); sudo apt-get install -y -qq --no-install-recommends --fix-missing ffmpeg fonts-inter >/dev/null; rm -rf ~/.cache/matplotlib
          pip install -q numpy scipy matplotlib pyproj requests qrcode pillow
          curl -sfL -o prev.npz "https://raw.githubusercontent.com/${{ github.repository }}/air/air.npz" || rm -f prev.npz
          python -u -W ignore tools/air_video.py air ru,uz prev.npz
          cd air && git init -q && git checkout -q -b air && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "air $(date -u +%F' '%H:%M)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" air
