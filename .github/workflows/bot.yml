name: Deploy bot
# the Telegram bot (telegram/worker.js) to the Cloudflare Worker osmon-bot, on every change of it (needs the CLOUDFLARE_API_TOKEN secret:
# a Cloudflare API token from the "Edit Cloudflare Workers" template). The secrets of the worker (BOT_TOKEN, GH_TOKEN, …) are kept.
on:
  push:
    branches: [main]
    paths: ['telegram/worker.js']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: bot, cancel-in-progress: false}
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: check
        run: node --check telegram/worker.js
      - name: deploy
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF" ]; then echo "::error::the CLOUDFLARE_API_TOKEN secret is not set"; exit 1; fi
          A=ed0f287fbf7471f481c3b797c091d6bc
          cat > meta.json <<'EOF'
          {"main_module":"worker.js","compatibility_date":"2024-09-23","keep_bindings":["secret_text"],"observability":{"enabled":true},
           "bindings":[{"type":"d1","name":"DB","id":"19e0f252-1086-4e37-9722-e63a9ccf730d"},
                       {"type":"plain_text","name":"SITE_URL","text":"https://otabekvafoev92-del.github.io/ob-havo-ecmwf/"},
                       {"type":"ai","name":"AI"}]}
          EOF
          r=$(curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts/osmon-bot" -H "Authorization: Bearer $CF" \
                -F "metadata=@meta.json;type=application/json" -F "worker.js=@telegram/worker.js;type=application/javascript+module")
          echo "$r" | head -c 400; echo
          echo "$r" | grep -q '"success": *true' || exit 1
