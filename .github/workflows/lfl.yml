name: Weather vs last year
# data of the mini-app page lfl.html (tools/lfl.py): kept on the "lfl" branch (one commit), read by the page from raw.githubusercontent.com
on:
  schedule:
    - cron: '23 0,6,12 * * *'  # 05:23, 11:23, 17:23 Tashkent
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: lfl, cancel-in-progress: false}
jobs:
  l:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          sudo apt-get install -y -qq ffmpeg fonts-inter >/dev/null; rm -rf ~/.cache/matplotlib; pip install -q requests numpy matplotlib openpyxl
          python tools/lfl.py lfl
          # the videos for the bot: Uzbekistan, by weeks since 1 January and this month by days
          for L in ru uz; do for M in weeks month; do python -W ignore tools/lfl_video.py lfl/lfl.json lfl/UZ_${M}_${L}.mp4 $L $M; done; done
          python -W ignore tools/lfl_xlsx.py lfl/lfl.json 'lfl/UZ_lfl_{lang}.xlsx' ru,uz  # the Excel report (business mode); also lfl/districts.json
          python -W ignore tools/lfl_pdf.py lfl/lfl.json 'lfl/UZ_lfl_{lang}.pdf' ru,uz  # the PDF report
          cd lfl && git init -q && git checkout -q -b lfl && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "lfl $(date -u +%F)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" lfl
