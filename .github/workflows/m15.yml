name: Moisture, clouds and precipitation, 15 days (video)
# where the moist air comes from, hour by hour, in the 15-day video's look (tools/moist15_video.py); kept on the "m15" branch
on:
  workflow_run: {workflows: ['Update ECMWF forecast'], types: [completed]}
  workflow_dispatch: {}
permissions: {contents: write, actions: read}
concurrency: {group: m15, cancel-in-progress: true}
jobs:
  m:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          (sudo apt-get update -qq >/dev/null || true); sudo apt-get install -y -qq --no-install-recommends --fix-missing ffmpeg fonts-inter >/dev/null; rm -rf ~/.cache/matplotlib
          pip install -q numpy scipy matplotlib pyproj qrcode requests eccodes metpy pillow
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=npz&per_page=1" --jq '.artifacts[0].workflow_run.id')
          timeout 600 gh run download $id -n npz -D npz && ls -la npz
          timeout 4800 python -u -W ignore tools/moist15_video.py npz/prob.npz m15 ru,uz
          for f in m15/moist15_*.mp4; do ffmpeg -v error -y -i $f -c:v libx264 -preset slow -b:v 900k -maxrate 1300k -bufsize 2600k -pix_fmt yuv420p -c:a copy -movflags +faststart ${f%.mp4}_s.mp4 && mv ${f%.mp4}_s.mp4 $f; done  # under 20 MB for Telegram
          cd m15 && git init -q && git checkout -q -b m15 && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "moisture 15 days $(date -u +%F' '%H:%M)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" m15
        env: {GH_TOKEN: '${{ github.token }}'}
