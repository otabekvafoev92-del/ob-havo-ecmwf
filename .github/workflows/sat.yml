name: Satellite videos
# the bot's satellite videos (tools/sat_videos.py), remade about every 30 minutes; kept on the "sat" branch (one commit)
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      test: {description: 'only UZ ru, to the sattest branch', type: boolean, default: false}
permissions: {contents: write}
concurrency: {group: sat, cancel-in-progress: false}  # a newer request waits for the running one
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/cache@v4  # the pictures and frames of the last runs: only the new snapshot is downloaded and drawn
        with:
          path: satcache
          key: sat-${{ github.run_id }}
          restore-keys: sat-
      - run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null; pip install -q numpy scipy matplotlib pillow requests
          B=sat; if [ "${{ inputs.test }}" = "true" ]; then export SAT_ONLY=UZ; B=sattest; fi
          python tools/sat_videos.py sat satcache
          cd sat && git init -q && git checkout -q -b $B && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "satellite $(date -u +%H:%M)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" $B
