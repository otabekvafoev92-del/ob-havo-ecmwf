name: 15-day videos of the bot's countries
# the 15-day hourly video (tools/place15.py --only country) for each country of the bot, after each site run; kept on "p15c-<country>" branches
on:
  workflow_run: {workflows: ['Update ECMWF forecast'], types: [completed]}
  workflow_dispatch: {}
permissions: {contents: write, actions: read}
concurrency: {group: p15c, cancel-in-progress: true}
jobs:
  c:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: {iso: [KZ, KG, TJ, TM, AZ, AM, BY, MD, RU, TR, EU, AS, AF, NA, SA, OC, world], mode: [prob, temp, cloud]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          (sudo apt-get update -qq >/dev/null || true); sudo apt-get install -y -qq --no-install-recommends --fix-missing ffmpeg fonts-inter >/dev/null; rm -rf ~/.cache/matplotlib
          pip install -q numpy scipy matplotlib pyproj qrcode requests pillow
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=npz&per_page=1" --jq '.artifacts[0].workflow_run.id')
          timeout 600 gh run download $id -n npz -D data
          case ${{ matrix.iso }} in EU|AS|AF|NA|SA|OC|world) A="--cont ${{ matrix.iso }}";; *) A="--iso ${{ matrix.iso }} --only country";; esac
          for l in ru uz; do P15_MODE=${{ matrix.mode }} timeout 1500 python -u -W ignore tools/place15.py data out --lang $l $A; done
          cd out && rm -f files.json && git init -q && git checkout -q -b p15c-${{ matrix.iso }}${{ matrix.mode == 'temp' && '-t' || matrix.mode == 'cloud' && '-cl' || '' }} && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "15 days ${{ matrix.iso }} $(date -u +%F' '%H:%M)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" p15c-${{ matrix.iso }}${{ matrix.mode == 'temp' && '-t' || matrix.mode == 'cloud' && '-cl' || '' }}
