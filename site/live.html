<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Osmon · по часам</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&family=Unbounded:wght@600;700&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{--navy:#2b3a4e;--paper:#f3f5f7;--card:#fff;--line:#dde3ea;--ink:#2b3a4e;--muted:#6b7a8c;--accent:#e0895a;--rain:#4f8cc4;--snow:#8a63b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Golos Text',system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;min-height:100vh;user-select:none;-webkit-user-select:none}
header{background:var(--navy);color:#fff;padding:calc(10px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:10px}
#fs{border:0;background:rgba(255,255,255,.14);color:#fff;width:36px;height:36px;border-radius:10px;font-size:18px;flex:none;cursor:pointer}
#fs:focus-visible,.rb:focus-visible,#zoom button:focus-visible{outline:2px solid #f0b88a;outline-offset:2px}
/* the bottom player: small round buttons and a short strip of hours; the map gets the rest */
#dock{padding-bottom:calc(4px + var(--tg-safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;padding:4px 6px;background:#fff;border-top:1px solid var(--line)}
.rb{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--navy);color:#fff;font:600 17px 'Golos Text',sans-serif;cursor:pointer}
.rb.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.rb.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#tl{flex:1;min-width:0;height:74px;display:block;touch-action:none}
header .c{font-family:Unbounded,sans-serif;font-weight:700;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .d{font-size:12px;color:#c9d6e5;text-align:right}
header .t{font-family:Unbounded,sans-serif;font-weight:700;font-size:22px;color:#f0b88a;min-width:74px;text-align:right}
#mapwrap{position:relative;margin:0;min-width:0;background:#e6e9ed;overflow:hidden;touch-action:none}
#zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.95);font:700 20px 'Golos Text',sans-serif;color:var(--ink)}
#map{display:block;width:100%}
#hint{position:absolute;left:10px;right:58px;bottom:8px;transition:opacity .4s;font-size:11px;color:var(--muted);background:rgba(255,255,255,.85);padding:3px 8px;border-radius:8px}
#place{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:12px;padding:7px 10px;box-shadow:0 2px 8px rgba(43,58,78,.12);max-width:58%;pointer-events:none}
#place .nm{font-weight:700;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#place .wh{font-size:10.5px;color:var(--muted);line-height:1.25;margin-top:1px}
#place .wh:empty{display:none}
#place .tv{font-family:Unbounded,sans-serif;font-weight:700;font-size:22px;line-height:1.15}
#place .rows{font-size:11px;line-height:1.45;color:var(--muted)}
#place .rows b{font-size:11.5px;color:var(--ink)}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper);font-size:15px;color:var(--muted);z-index:9}
</style>
</head>
<body>
<div id="load">…</div>
<header><div class="c" id="hc"></div><div class="d" id="hd"></div><div class="t" id="ht"></div><button id="fs" title="Во весь экран" aria-label="Во весь экран">⛶</button></header>
<div id="main"><div id="mapwrap"><canvas id="map"></canvas><div id="hint"></div>
<div id="place"><div class="nm" id="pn"></div><div class="wh" id="pw"></div><div class="tv" id="pt"></div><div class="rows" id="pr"></div></div>
<div id="zoom"><button id="zin" aria-label="+">+</button><button id="zout" aria-label="−">−</button><button id="zfit" aria-label="⤢" style="font-size:15px">⤢</button></div></div>
<div id="dock"><button class="rb" id="play"></button><button class="rb alt" id="snd"></button><canvas id="tl"></canvas></div></div>
<script>
'use strict';
const Q = new URLSearchParams(location.search), tg = window.Telegram && Telegram.WebApp;

const LANG = ['ru', 'uz', 'tr'].includes(Q.get('l')) ? Q.get('l') : 'ru', REG = (Q.get('r') || 'UZ').toUpperCase(), D15 = Q.get('m') === '15';  // m=15: the 15 days (model windows)
const TX = {

  uz: { hint: 'Xaritaga bosing — shu joy ob-havosi · ikki barmoq — kattalashtirish', play: '▶ Ko‘rish', pause: '❚❚ To‘xtatish', son: '🔊 Ob-havo ovozi', soff: '🔇 Ovozni o‘chirish', rain: 'Yomg‘ir', snow: 'Qor', cl: 'Bulutli', wind: 'Shamol', ms: 'm/s', today: 'Bugun', tom: 'Ertaga', here: 'Xaritadagi nuqta', wd: ['Du','Se','Ch','Pa','Ju','Sh','Ya'], err: 'Ma’lumotlar tayyorlanmoqda, keyinroq urinib ko‘ring', names: { UZ: 'O‘zbekiston', KZ: 'Qozog‘iston', KG: 'Qirg‘iziston', TJ: 'Tojikiston', TM: 'Turkmaniston', AZ: 'Ozarbayjon', AM: 'Armaniston', BY: 'Belarus', MD: 'Moldova', RU: 'Rossiya', TR: 'Turkiya' } },
  tr: { hint: 'Haritaya dokunun — o yerin havası · iki parmak — yakınlaştır', play: '▶ İzle', pause: '❚❚ Durdur', son: '🔊 Hava sesi', soff: '🔇 Sesi kapat', rain: 'Yağmur', snow: 'Kar', cl: 'Bulutlu', wind: 'Rüzgâr', ms: 'm/s', today: 'Bugün', tom: 'Yarın', here: 'Haritadaki nokta', wd: ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'], err: 'Veriler hazırlanıyor, sonra tekrar deneyin', names: { UZ: 'Özbekistan', KZ: 'Kazakistan', KG: 'Kırgızistan', TJ: 'Tacikistan', TM: 'Türkmenistan', AZ: 'Azerbaycan', AM: 'Ermenistan', BY: 'Belarus', MD: 'Moldova', RU: 'Rusya', TR: 'Türkiye' } },
}[LANG];
const RAIN = [[188,220,242],[140,192,230],[90,159,214],[58,120,181]], SNOWC = [[228,212,240],[204,176,227],[173,139,208],[138,99,184]];
const $ = id => document.getElementById(id);
if (!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); };
let M, B, H, NX, NY, hour = 0, playing = false, sel = null, sound = null;
const fmtT = t => (t > 0.5 ? '+' : t < -0.5 ? '−' : '') + Math.abs(Math.round(t)) + '°';

async function load() {
  const base = 'prob/hr/' + REG + (D15 ? '_live15' : '_live');
  const [m, b] = await Promise.all([fetch(base + '.json?t=' + Date.now()).then(r => r.ok ? r.json() : null), fetch(base + '.bin?t=' + Date.now()).then(r => r.ok ? r.arrayBuffer() : null)]);
  if (!m || !b) { $('load').textContent = TX.err; return; }
  M = m; B = new Uint8Array(b); H = M.hours; NX = M.nx; NY = M.ny;
  // the regions and districts (Uzbekistan, Kazakhstan, Kyrgyzstan): borders, names, and where a tapped point lies
  try { const g = await fetch('prob/hr/' + REG + '_geo.json?t=' + Date.now()).then(r => r.ok ? r.json() : null);
    if (g) { GEO = g; M.a1 = g.adm1.flatMap(a => a.r); M.a2 = g.adm2.flatMap(a => a.r); } } catch (e) {}
  const st = new Date(M.start + ':00Z'), now = new Date(Date.now() + M.off * 3600e3);
  hour = M.times ? Math.max(0, M.times.findIndex((t, i) => i === H - 1 || new Date(M.times[i + 1] + ':00Z') > now)) : Math.max(0, Math.min(H - 1, Math.floor((now - st) / 3600e3)));
  const mc = M.cities.find(c => c.ru === (M.main[LANG] || M.main.ru)) || M.cities[0];
  sel = { lat: mc.lat, lon: mc.lon, name: mc[LANG] || mc.ru, city: true };
  $('hc').textContent = TX.names[REG] || REG; $('hint').textContent = TX.hint; $('play').textContent = '▶'; $('play').setAttribute('aria-label', TX.play); $('snd').textContent = '🔈'; $('snd').setAttribute('aria-label', TX.son);
  $('load').remove(); setup(); draw();
  // make the other hours' pictures and lines in the quiet moments, from the current hour on, so playing is smooth
  let wi = 0; const order = Array.from({ length: H }, (_, i) => (Math.floor(hour) + i) % H);
  const idle = window.requestIdleCallback || (f => setTimeout(() => f({ timeRemaining: () => 8 }), 30));
  const warm = dl => { while (wi < order.length && dl.timeRemaining() > 4) { const k = order[wi++]; field(k); if (window.d3) contours(k); } if (wi < order.length) idle(warm); };
  idle(warm);
}

// the grid: value of variable v at hour h (fractional) and grid position (fx, fy)
const raw = (h, v, y, x) => B[((h * 4 + v) * NY + y) * NX + x];
function val(h, v, lat, lon) {  // no arrays made inside: this runs tens of thousands of times per picture
  const fx = (lon - M.lon[0]) / (M.lon[1] - M.lon[0]) * (NX - 1), fy = (lat - M.lat[0]) / (M.lat[1] - M.lat[0]) * (NY - 1);
  if (!(fx >= 0 && fy >= 0 && fx <= NX - 1 && fy <= NY - 1)) return NaN;
  const x0 = Math.min(NX - 2, Math.floor(fx)), y0 = Math.min(NY - 2, Math.floor(fy)), ax = fx - x0, ay = fy - y0;
  const h0 = Math.min(H - 1, Math.floor(h)), h1 = Math.min(H - 1, h0 + 1), wh = h - h0, sc = M.scale[v];
  const k00 = (1 - ay) * (1 - ax), k01 = (1 - ay) * ax, k10 = ay * (1 - ax), k11 = ay * ax;
  let s = 0, w = 0;
  for (let j = 0; j < 2; j++) {
    const kh = j ? wh : 1 - wh; if (kh <= 0) continue;
    const o = ((j ? h1 : h0) * 4 + v) * NY * NX, r0 = o + y0 * NX + x0, r1 = r0 + NX;
    let b = B[r0]; if (b !== 255 && k00 > 0) { s += b * k00 * kh; w += k00 * kh; }
    b = B[r0 + 1]; if (b !== 255 && k01 > 0) { s += b * k01 * kh; w += k01 * kh; }
    b = B[r1]; if (b !== 255 && k10 > 0) { s += b * k10 * kh; w += k10 * kh; }
    b = B[r1 + 1]; if (b !== 255 && k11 > 0) { s += b * k11 * kh; w += k11 * kh; }
  }
  return w ? s / w / sc[0] - sc[1] : NaN;
}

// projection: plain lon/lat scaled by the cosine of the middle latitude; the map can be zoomed (pinch, buttons)
// and moved with a finger; it opens zoomed in so the country fills the height, centred on the chosen city
let cv, cx, W, Hc, P0, PS0, kx, Z = 1, PAN = [0, 0], inited = false;
function setup() {
  cv = $('map'); cx = cv.getContext('2d');
  const all = M.country.flat(); let lo0 = Infinity, lo1 = -Infinity, la0 = Infinity, la1 = -Infinity;
  for (const [x, y] of all) { lo0 = Math.min(lo0, x); lo1 = Math.max(lo1, x); la0 = Math.min(la0, y); la1 = Math.max(la1, y); }
  kx = Math.cos((la0 + la1) / 2 * Math.PI / 180);
  const pw = (lo1 - lo0) * kx * 1.02, ph = (la1 - la0) * 1.04;
  const wide = window.innerWidth >= 760;  // side by side: the map as tall as the window
  const tl = $('tl'); tl.style.height = TLH + 'px';
  W = cv.clientWidth; Hc = Math.round(Math.max(260, Math.max(window.innerHeight, (tg && tg.viewportStableHeight) || 0) - document.querySelector('header').offsetHeight - $('dock').offsetHeight));  // the map takes all the room left
  const dpr = devicePixelRatio || 1; cv.width = W * dpr; cv.height = Hc * dpr; cv.style.height = Hc + 'px'; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  PS0 = Math.min(W / pw, Hc / ph); P0 = [(lo0 + lo1) / 2, (la0 + la1) / 2];
  if (!inited) {  // the first view: the country as tall as the map, the chosen city in sight
    Z = Hc > W * 1.2 ? Math.min(2.2, Math.max(1, (Hc / ph) / PS0 * 0.6)) : 1; PAN = [0, 0];  // a tall phone map: the country fills it, the chosen city near the middle
    if (Z > 1) { const [x, y] = proj(sel.lon, sel.lat); PAN = [(W / 2 - x) * 0.35, 0]; clampPan(); }
  }
  tl.width = tl.clientWidth * dpr; tl.height = TLH * dpr; tl.style.height = TLH + 'px'; tl.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  if (inited) return; inited = true;

  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); moved = false; last = [e.clientX, e.clientY];
    if (pts.size === 2) { const [a_, b_] = [...pts.values()]; pinch = { d: Math.hypot(a_[0] - b_[0], a_[1] - b_[1]), z: Z }; } });
  cv.addEventListener('pointermove', e => { if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, [e.clientX, e.clientY]);
    const r = cv.getBoundingClientRect();
    if (pts.size === 2 && pinch) { const [a_, b_] = [...pts.values()], d = Math.hypot(a_[0] - b_[0], a_[1] - b_[1]);
      zoomAt(pinch.z * d / pinch.d / Z, (a_[0] + b_[0]) / 2 - r.left, (a_[1] + b_[1]) / 2 - r.top); moved = true; return; }
    const dx = e.clientX - last[0], dy = e.clientY - last[1];
    if (moved || Math.hypot(dx, dy) > 6) { moved = true; PAN[0] += dx; PAN[1] += dy; clampPan(); last = [e.clientX, e.clientY]; draw(); } });
  const up = e => { const was = pts.has(e.pointerId); pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
    if (!was || moved || pts.size) return; const r = cv.getBoundingClientRect(), [lon, lat] = unproj(e.clientX - r.left, e.clientY - r.top);
    $('hint').style.opacity = 0;
    if (isFinite(val(hour, 1, lat, lon))) { sel = { lat, lon, name: TX.here, city: false }; const c = nearCity(lat, lon); if (c) sel = { lat: c.lat, lon: c.lon, name: c[LANG] || c.ru, city: true }; draw(); } };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', e => { pts.delete(e.pointerId); pinch = null; });
  cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  $('zin').onclick = () => zoomAt(1.4, W / 2, Hc / 2); $('zout').onclick = () => zoomAt(1 / 1.4, W / 2, Hc / 2);
  $('zfit').onclick = () => { Z = 1; PAN = [0, 0]; draw(); };
  let drag = false; const seek = e => { const r = tl.getBoundingClientRect(); hour = Math.max(0, Math.min(H - 1, (e.clientX - r.left - 4) / (r.width - 8) * H - 0.5)); stop(); draw(); };
  tl.addEventListener('pointerdown', e => { drag = true; tl.setPointerCapture(e.pointerId); seek(e); });
  tl.addEventListener('pointermove', e => drag && seek(e)); tl.addEventListener('pointerup', () => { drag = false; hour = Math.round(hour); draw(); });

    try { if (tg && tg.requestFullscreen && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')) { tg.isFullscreen ? tg.exitFullscreen() : tg.requestFullscreen(); return; } } catch (e) {}

  };
  try { tg && tg.onEvent && tg.onEvent('fullscreenChanged', () => setTimeout(() => { setup(); draw(); }, 150)); } catch (e) {}
  document.addEventListener('fullscreenchange', () => setTimeout(() => { setup(); draw(); }, 150));
  $('play').onclick = () => playing ? stop() : start();
  $('snd').onclick = toggleSound;
  addEventListener('resize', () => { setup(); draw(); });
  try { tg && tg.onEvent && tg.onEvent('viewportChanged', () => { setup(); draw(); }); } catch (e) {}  // Telegram opens small and then grows: the map grows with it
}
function zoomAt(f, x, y) { const z2 = Math.max(1, Math.min(6, Z * f)); f = z2 / Z; PAN = [x - W / 2 - (x - W / 2 - PAN[0]) * f, y - Hc / 2 - (y - Hc / 2 - PAN[1]) * f]; Z = z2; clampPan(); draw(); }
function clampPan() { const mx = Math.max(0, (Z - 1) * W / 2 + W * 0.15), my = Math.max(0, (Z - 1) * Hc / 2 + Hc * 0.15); PAN = [Math.max(-mx, Math.min(mx, PAN[0])), Math.max(-my, Math.min(my, PAN[1]))]; }

const unproj = (x, y) => [P0[0] + (x - W / 2 - PAN[0]) / (kx * PS0 * Z), P0[1] - (y - Hc / 2 - PAN[1]) / (PS0 * Z)];
const nearCity = (lat, lon) => M.cities.find(c => { const [a, b] = proj(c.lon, c.lat), [x, y] = proj(lon, lat); return Math.hypot(a - x, b - y) < 24; });
function path(rings) { cx.beginPath(); for (const r of rings) { r.forEach(([x, y], i) => { const [a, b] = proj(x, y); i ? cx.lineTo(a, b) : cx.moveTo(a, b); }); cx.closePath(); } }
// the outlines (country, neighbours, regions) as ready paths: made again only when the map is moved or zoomed, not every frame
let PV = '', PC = {};
function P2(name) {
  const key = `${W},${Hc},${Z},${PAN[0]},${PAN[1]}`; if (key !== PV) { PV = key; PC = {}; }
  if (PC[name]) return PC[name];
  const p = new Path2D(); for (const r of M[name]) { r.forEach(([x, y], i) => { const [a, b] = proj(x, y); i ? p.lineTo(a, b) : p.moveTo(a, b); }); p.closePath(); }
  return PC[name] = p;
}

// the precipitation layer: a small image of the grid (row 0 = the north), smoothed when it is drawn large
const LAT_N = () => Math.max(M.lat[0], M.lat[1]), LAT_S = () => Math.min(M.lat[0], M.lat[1]);
const FC = {};  // one small picture per whole hour, made once
function field(h) {
  if (FC[h]) return FC[h]; const off = FC[h] = document.createElement('canvas'); off.width = NX; off.height = NY;
  const o = off.getContext('2d'), im = o.createImageData(NX, NY), n = LAT_N(), s_ = LAT_S();
  for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++) {
    const lat = n - (n - s_) * y / (NY - 1), lon = M.lon[0] + (M.lon[1] - M.lon[0]) * x / (NX - 1);
    const p = val(h, 0, lat, lon), t = val(h, 1, lat, lon), i = (y * NX + x) * 4;
    if (!(p >= 30)) { im.data[i + 3] = 0; continue; }
    const c = (t <= 0.5 ? SNOWC : RAIN)[Math.min(3, Math.floor((p - 30) / 20))];
    im.data[i] = c[0]; im.data[i + 1] = c[1]; im.data[i + 2] = c[2]; im.data[i + 3] = 235;
  }
  o.putImageData(im, 0, 0); return off;
}
function paint(f) {  // the grid image over its cells (each pixel is the centre of a cell)
  const [x0, y0] = proj(M.lon[0], LAT_N()), [x1, y1] = proj(M.lon[1], LAT_S()), dx = (x1 - x0) / (NX - 1), dy = (y1 - y0) / (NY - 1);
  cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high'; cx.drawImage(f, x0 - dx / 2, y0 - dy / 2, x1 - x0 + dx, y1 - y0 + dy);
}

// the edges of the rain/snow areas and the isotherms every 5° (labelled), inside the country
const LC = {};  // the contour lines per whole hour, made once (the heavy part: a finer grid, a blur, d3)
function contours(h) {
  if (LC[h]) return LC[h];
  // a 3× finer grid (bilinear between the model points) so the lines are smooth curves, not steps
  const n = LAT_N(), s_ = LAT_S(), F = 3, GX = (NX - 1) * F + 1, GY = (NY - 1) * F + 1, Pv = new Float64Array(GX * GY), Tv = new Float64Array(GX * GY);

// playing: one hour per 0.9 s, the map flowing smoothly between hours
