<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Osmon · откуда осадки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&family=Unbounded:wght@600;700&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--navy:#2b3a4e;--line:#dde3ea;--ink:#2b3a4e;--muted:#6b7a8c;--accent:#f08a24;--paper:#f3f5f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:'Golos Text',system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
header{background:var(--navy);color:#fff;padding:calc(8px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) 12px 8px;display:flex;align-items:center;gap:8px}
header .c{font-family:Unbounded,sans-serif;font-weight:700;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .t{font-family:Unbounded,sans-serif;font-weight:700;font-size:15px;color:#f0b88a;text-align:right;white-space:nowrap}
#tabs{display:flex;gap:6px;padding:6px 8px;background:var(--paper);border-bottom:1px solid var(--line);overflow-x:auto}
#tabs button,.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font:600 13px 'Golos Text',sans-serif;cursor:pointer}
#tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.on{background:#fff4e8;border-color:var(--accent);color:#a1520c}
#wrap{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;background:#fff}
canvas{display:block;width:100%;height:100%}
#legend{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:11px;line-height:1.5;max-width:62%}
#legend i{display:inline-block;width:18px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
#tip{position:absolute;display:none;background:var(--navy);color:#fff;border-radius:10px;padding:7px 10px;font-size:13px;pointer-events:none;max-width:70%;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.95);font:700 20px 'Golos Text',sans-serif;color:var(--ink)}
#layers{display:flex;gap:6px;padding:6px 8px;overflow-x:auto;background:#fff;border-top:1px solid var(--line)}
#dock{display:flex;align-items:center;gap:8px;padding:6px 10px calc(8px + var(--tg-safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line)}
.rb{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--navy);color:#fff;font:600 16px 'Golos Text',sans-serif;cursor:pointer}
.rb.alt{background:#fff;color:var(--ink);border:1px solid var(--line);font-size:13px}
#time{flex:1;accent-color:var(--accent)}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center;padding:20px;pointer-events:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header><div class="c" id="title">Откуда придут осадки</div><div class="t" id="clock">—</div></header>
<div id="tabs"><button id="tabF" class="on"></button><button id="tabS"></button></div>
<div id="wrap"><canvas id="cv"></canvas><div id="legend"></div><div id="tip"></div><div id="msg"></div>
  <div id="zoom"><button id="zin" aria-label="+">+</button><button id="zout" aria-label="−">−</button></div></div>
<div id="layers"></div>
<div id="dock"><button class="rb" id="play" aria-label="play">▶</button><input type="range" id="time" min="0" max="72" step="0.05" value="0"><button class="rb alt" id="spd">1×</button></div>
<script>
// Osmon · «откуда придут осадки» interactive (prob/moisture.py export_live) and the satellite now (EUMETSAT Meteosat IODC)

const TX = {

    legS: 'Спутник Meteosat (EUMETSAT), инфракрасный: <b>белое — тучи</b>, чем белее — тем выше и холоднее.<br><i style="background:#3d95ec"></i>оценка осадков со спутника (H SAF)',
    rain: 'дождь', snow: 'снег', cloud: 'облачно', clear: 'ясно', mm: 'мм/3 ч', from: 'Влага', load: 'Загружаю…', none: 'Данных пока нет — загляните чуть позже.', satErr: 'Снимки спутника сейчас недоступны.', ago: 'назад', tz: { UZ: 'по Ташкенту', KZ: 'по Астане', KG: 'по Бишкеку' },
    wd: ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'] },
  uz: { title: 'Yog‘in qayerdan keladi', tabF: '🧭 Prognoz', tabS: '🛰 Onlayn: sun’iy yo‘ldosh', L: { cl: 'Bulut va yog‘in', fr: 'Frontlar', pa: 'Namlik yo‘li', wi: 'Shamol' },
    leg: '<i style="background:#9aa3ad"></i>bulut <i style="background:#3d95ec"></i>yomg‘ir <i style="background:#9b72e2"></i>qor<br><b style="color:#1f5fd1">▲</b> sovuq front <b style="color:#d6402b">●</b> iliq<br><b style="color:#f08a24">- - ▶</b> namlikning shaharga yo‘li',
    legS: 'Meteosat (EUMETSAT) infraqizil: <b>oq — bulut</b>, qancha oq bo‘lsa — shuncha baland.<br><i style="background:#3d95ec"></i>sun’iy yo‘ldosh bo‘yicha yog‘in (H SAF)',
    rain: 'yomg‘ir', snow: 'qor', cloud: 'bulutli', clear: 'ochiq', mm: 'mm/3 soat', from: 'Namlik', load: 'Yuklanmoqda…', none: 'Ma’lumot hali yo‘q — birozdan keyin qarang.', satErr: 'Sun’iy yo‘ldosh suratlari hozir yo‘q.', ago: 'oldin', tz: { UZ: 'Toshkent vaqti', KZ: 'Ostona vaqti', KG: 'Bishkek vaqti' },
    wd: ['Ya', 'Du', 'Se', 'Ch', 'Pa', 'Ju', 'Sh'] } }[LANG];
document.getElementById('title').textContent = TX.title; document.getElementById('tabF').textContent = TX.tabF; document.getElementById('tabS').textContent = TX.tabS;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), wrap = document.getElementById('wrap'), tip = document.getElementById('tip'), msg = document.getElementById('msg');
const slider = document.getElementById('time'), playB = document.getElementById('play'), spdB = document.getElementById('spd'), clock = document.getElementById('clock');
let mode = 'F', M = null, frames = [], relief = null, playing = false, speed = 1, t = 0, last = 0, layers = { cl: true, fr: true, pa: true, wi: true };
let view = { s: 1, x: 0, y: 0 }, DPR = Math.min(2, window.devicePixelRatio || 1), W = 0, H = 0, k0 = 1, lat0 = 40, bb = null;
const BASE = `prob/hr/live/${REG}/`;
// --- the projection: lon/lat → screen (plate carrée with the longitudes shrunk at the middle latitude)
function fit() {
  W = wrap.clientWidth; H = wrap.clientHeight; cv.width = W * DPR; cv.height = H * DPR;
  const v = M ? M.view : [42, 80, 30, 49]; lat0 = (v[2] + v[3]) / 2; const kx = Math.cos(lat0 * Math.PI / 180);
  k0 = Math.min(W / ((v[1] - v[0]) * kx), H / (v[3] - v[2])); bb = v; draw();

const P = (lon, lat) => { const kx = Math.cos(lat0 * Math.PI / 180), cx = (bb[0] + bb[1]) / 2, cy = (bb[2] + bb[3]) / 2;
  return [W / 2 + ((lon - cx) * kx * k0) * view.s + view.x, H / 2 - ((lat - cy) * k0) * view.s + view.y]; };
const Pinv = (x, y) => { const kx = Math.cos(lat0 * Math.PI / 180), cx = (bb[0] + bb[1]) / 2, cy = (bb[2] + bb[3]) / 2;
  return [cx + (x - W / 2 - view.x) / (view.s * k0 * kx), cy - (y - H / 2 - view.y) / (view.s * k0)]; };

// --- the base map: water, relief, borders, rivers, cities
function base(dark) {

  if (!M) return;

}
function lines(dark) {

  for (const [w, c] of M.water.rivers) { ctx.lineWidth = (0.5 + 0.5 * w) * Math.min(2, Math.sqrt(view.s)); poly(c); ctx.stroke(); }
  if (!dark) { ctx.lineWidth = 0.9; for (const r of M.water.sea) { poly(r, true); ctx.stroke(); } }
  ctx.strokeStyle = dark ? 'rgba(255,255,255,.8)' : '#5b6b7a'; ctx.lineWidth = 1.1; for (const r of M.countries) { poly(r, true); ctx.stroke(); }

    ctx.strokeStyle = dark ? 'rgba(255,255,255,.22)' : 'rgba(80,95,110,.28)'; ctx.lineWidth = 0.4; for (const a of GEO.adm2 || []) for (const r of a.r || []) { poly(r, true); ctx.stroke(); }
    ctx.strokeStyle = dark ? 'rgba(255,255,255,.5)' : 'rgba(60,75,90,.6)'; ctx.lineWidth = 0.9; for (const a of GEO.adm1 || []) for (const r of a.r || []) { poly(r, true); ctx.stroke(); }
    if (view.s >= 1.8) {  // zoomed in: the districts' names
      ctx.font = `500 ${9 + Math.min(3, view.s / 2)}px 'Golos Text',sans-serif`; ctx.textAlign = 'center'; ctx.fillStyle = dark ? 'rgba(255,255,255,.75)' : 'rgba(70,80,95,.8)';
      for (const d of GEO.adm2 || []) { const [x, y] = P(d.c[0], d.c[1]); if (x > 0 && y > 0 && x < W && y < H) ctx.fillText((d.name[LANG] || d.name.ru).replace(/ р-н$| tumani$/, ''), x, y); }
      ctx.textAlign = 'left';
    }
  }
  ctx.font = `600 ${11 + Math.min(4, view.s)}px 'Golos Text',sans-serif`; ctx.textBaseline = 'middle'; const boxes = [];
  for (const c of M.cities) {
    const [x, y] = P(c.lon, c.lat); if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
    const name = c.n[LANG] || c.n.ru; if (!name) continue; const w = ctx.measureText(name).width;
    const b = [x + 5, y - 8, x + 9 + w, y + 8]; if (boxes.some(o => !(b[2] < o[0] || b[0] > o[2] || b[3] < o[1] || b[1] > o[3]))) continue; boxes.push(b);
    ctx.fillStyle = dark ? '#fff' : '#2b3a4e'; ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 7); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = dark ? 'rgba(0,0,0,.7)' : 'rgba(255,255,255,.9)'; ctx.strokeText(name, x + 6, y); ctx.fillText(name, x + 6, y);
  }
}
// --- fronts with their marks (▲ cold, ● warm), drawn along the line
function front(p, kind) {
  const col = kind === 'cold' ? '#1f5fd1' : '#d6402b'; ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2.4; poly(p); ctx.stroke();
  const pts = p.map(q => P(q[0], q[1])); let acc = 0, next = 14;
  for (let i = 1; i < pts.length; i++) {
    const [ax, ay] = pts[i - 1], [bx, by] = pts[i], seg = Math.hypot(bx - ax, by - ay); if (!seg) continue;
    while (acc + seg >= next) {
      const f = (next - acc) / seg, x = ax + (bx - ax) * f, y = ay + (by - ay) * f, ux = (bx - ax) / seg, uy = (by - ay) / seg, nx = -uy, ny = ux, s = 6;
      ctx.beginPath();
      if (kind === 'cold') { ctx.moveTo(x - ux * s, y - uy * s); ctx.lineTo(x + ux * s, y + uy * s); ctx.lineTo(x + nx * s * 1.3, y + ny * s * 1.3); }

// --- the wind: particles that drift with the 700 hPa wind of the hour
const parts = Array.from({ length: 700 }, () => ({ x: Math.random(), y: Math.random(), a: Math.random() * 60 }));
function windAt(fr, lon, lat) {
  const [ny, nx, la0, lo0, st] = M.wind_grid, gy = (lat - la0) / st, gx = (lon - lo0) / st;
  if (gx < 0 || gy < 0 || gx > nx - 1 || gy > ny - 1) return null;
  const i = Math.floor(gy), j = Math.floor(gx), fy = gy - i, fx = gx - j, g = (a, b) => fr.w[Math.min(ny - 1, a) * nx + Math.min(nx - 1, b)];

  return [0, 1].map(c => (q[0][c] * (1 - fx) + q[1][c] * fx) * (1 - fy) + (q[2][c] * (1 - fx) + q[3][c] * fx) * fy);
}
function wind(fr) {
  ctx.lineCap = 'round';
  for (const p of parts) {
    const lon = bb[0] + p.x * (bb[1] - bb[0]), lat = bb[2] + p.y * (bb[3] - bb[2]), w = windAt(fr, lon, lat);
    if (!w || p.a > 80) { p.x = Math.random(); p.y = Math.random(); p.a = 0; continue; }
    const sp = Math.hypot(w[0], w[1]), [x0, y0] = P(lon, lat), dl = 0.004 * (1 + sp / 6);
    const nlon = lon + w[0] / sp * dl * (bb[1] - bb[0]) || lon, nlat = lat + w[1] / sp * dl * (bb[3] - bb[2]) || lat, [x1, y1] = P(nlon, nlat);
    const c = Math.min(1, sp / 25); ctx.strokeStyle = `rgba(${Math.round(160 - 120 * c)},${Math.round(180 - 120 * c)},${Math.round(205 - 90 * c)},${0.25 + 0.55 * Math.sin(Math.PI * p.a / 80)})`;
    ctx.lineWidth = 0.7 + 1.4 * c; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + (x1 - x0) * 6, y0 + (y1 - y0) * 6); ctx.stroke();
    p.x = (nlon - bb[0]) / (bb[1] - bb[0]); p.y = (nlat - bb[2]) / (bb[3] - bb[2]); p.a += 1;
  }
}
// --- the forecast frame at time t (hours from the run): cross-fade between the hours
function drawF() {
  base(false);
  if (!M) return;
  const i = Math.min(frames.length - 1, Math.floor(t)), f = t - i, fr = M.frames[i];
  if (layers.cl) { imgAt(frames[i], M.bounds, 1); if (f > 0 && frames[i + 1]) imgAt(frames[i + 1], M.bounds, f); }
  lines(false);
  if (layers.wi && fr) wind(fr);
  if (layers.fr && fr) for (const fl of fr.f) front(fl.p, fl.k);
  if (fr) for (const [lon, lat, lab, hpa] of fr.c) {

    const col = lab === 'L' ? '#d6402b' : '#2f6fd0', txt = lab === 'L' ? (LANG === 'uz' ? 'P' : 'Н') : (LANG === 'uz' ? 'Y' : 'В');
    ctx.strokeText(txt, x, y); ctx.fillStyle = col; ctx.fillText(txt, x, y); ctx.font = `600 10px 'Golos Text',sans-serif`; ctx.fillText(hpa, x, y + 16); ctx.textAlign = 'left';

    ctx.font = `700 12px 'Golos Text',sans-serif`; const w = ctx.measureText(lab).width; ctx.fillStyle = '#f08a24'; ctx.fillRect(sx - w / 2 - 6, sy - 26, w + 12, 20); ctx.fillStyle = '#1d2a3a'; ctx.textAlign = 'center'; ctx.fillText(lab, sx, sy - 16); ctx.textAlign = 'left';

// --- the satellite now: Meteosat IODC (45.5° E) infrared and the H SAF rain estimate, the last 3 hours every 15 min
const SAT = { frames: [], i: 0, t0: 0 };
function satUrl(layer, time, fmt) {

function loadSat() {

function satReady(ok) { SAT.frames = SAT.frames.filter(f => !f.bad); msg.textContent = ok ? '' : TX.satErr; slider.max = Math.max(0, SAT.frames.length - 1); slider.step = 0.02; t = SAT.frames.length - 1; slider.value = t; draw(); }
function drawS() {
  base(true); const n = SAT.frames.length; if (!n) { lines(true); return; }

const TZH = { UZ: 5, KZ: 5, KG: 6 };
function draw() { if (!W) return; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); mode === 'F' ? drawF() : drawS(); }
// --- the player
function tick(ts) {

playB.onclick = () => { playing = !playing; playB.textContent = playing ? '❚❚' : '▶'; };
spdB.onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1; spdB.textContent = (speed === 0.5 ? '0,5' : speed) + '×'; };
slider.oninput = () => { t = +slider.value; draw(); };
// --- layers and tabs
function chips() {

// --- load
let GEO = null;
function inRing(x, y, r) { let c = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++) { const [xi, yi] = r[i], [xj, yj] = r[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
