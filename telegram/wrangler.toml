# Deploy with:  npx wrangler deploy   (from this folder), then:  npx wrangler secret put BOT_TOKEN
name = "osmon-bot"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# your GitHub Pages address, e.g. https://otabekvafoev92-del.github.io/ob-havo-ecmwf
SITE_URL = "https://otabekvafoev92-del.github.io/ob-havo-ecmwf"

# visit counter (by country / city): create once with  npx wrangler d1 create osmon  and paste the id here
[[d1_databases]]
binding = "DB"
database_name = "osmon"
database_id = "19e0f252-1086-4e37-9722-e63a9ccf730d"

# automatic forecast posts to groups and channels after each website update
[triggers]
crons = ["*/20 * * * *"]
